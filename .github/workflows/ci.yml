name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax (bash -n)
        run: |
          set -euo pipefail
          for f in install.sh nodego.sh; do
            bash -n "$f"
            echo "$f: syntax ok"
          done

      # Раньше здесь был сторонний экшен ludeeus/action-shellcheck — он перестал
      # работать на обновившемся раннере и падал без полезного вывода. Ставим
      # shellcheck официальной сборкой фиксированной версии: одинаковое поведение
      # в CI и локально, и ошибки видно прямо в логе.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | sed -n '1,2p'

      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck -S style install.sh nodego.sh
          echo "shellcheck clean"

  templates:
    name: templates consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Manifest, self-containment and inline JS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys

          root = "templates"
          dirs = sorted(d for d in os.listdir(root) if os.path.isdir(os.path.join(root, d)))
          keys = []
          for line in open(os.path.join(root, "manifest.tsv"), encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              keys.append(line.split("|", 1)[0].strip())
          if len(keys) != len(set(keys)):
              sys.exit("duplicate keys in manifest.tsv")
          missing_dir = [k for k in keys if k not in dirs]
          missing_key = [d for d in dirs if d not in keys]
          if missing_dir:
              sys.exit(f"manifest keys without folder: {missing_dir}")
          if missing_key:
              sys.exit(f"folders without manifest entry: {missing_key}")

          # Заглушка — полноценный сайт: один самодостаточный index.html.
          problems = []
          js_dir = os.path.join(os.environ["RUNNER_TEMP"], "tpl-js")
          os.makedirs(js_dir, exist_ok=True)
          for key in keys:
              path = os.path.join(root, key, "index.html")
              if not os.path.isfile(path):
                  problems.append(f"{path}: missing")
                  continue
              html = open(path, encoding="utf-8").read()
              size = os.path.getsize(path)
              if size < 15000:
                  problems.append(f"{path}: {size} bytes — нужен полноценный сайт, не заглушка")
              required = {
                  "<html lang": "нет <html lang>",
                  "<title>": "нет <title>",
                  'name="viewport"': "нет viewport meta",
                  'name="description"': "нет meta description",
                  'rel="icon"': "нет favicon",
                  "<script": "нет inline JS",
                  "<h1": "нет <h1>",
              }
              for needle, msg in required.items():
                  if needle not in html:
                      problems.append(f"{path}: {msg}")
              for url in re.findall(r"https?://[^\s\"'<>)]+", html):
                  if url.startswith(("http://www.w3.org/", "https://www.w3.org/")):
                      continue
                  problems.append(f"{path}: внешний URL {url} (сайт должен быть самодостаточным)")
              for i, m in enumerate(re.finditer(r"<script\b([^>]*)>(.*?)</script>", html, re.S)):
                  attrs, body = m.group(1), m.group(2)
                  if "src=" in attrs or "json" in attrs or "template" in attrs:
                      continue
                  if body.strip():
                      ext = "mjs" if "module" in attrs else "js"
                      with open(os.path.join(js_dir, f"{key}-{i}.{ext}"), "w", encoding="utf-8") as fh:
                          fh.write(body)
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"templates ok: {len(keys)}")
          PY

      - name: Inline JS parses
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/tpl-js/*.js "$RUNNER_TEMP"/tpl-js/*.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::инлайн-скрипты не найдены"
            exit 1
          fi
          for f in "${files[@]}"; do
            node --check "$f" || { echo "::error::синтаксис JS в $f"; exit 1; }
          done
          echo "inline JS ok: ${#files[@]} script(s)"

      - name: Installer and nodego read the manifest
        run: |
          set -euo pipefail
          for f in install.sh nodego.sh; do
            grep -q 'manifest.tsv' "$f" || { echo "::error::$f does not read templates/manifest.tsv"; exit 1; }
          done
          echo "manifest wiring ok"

      - name: Embedded scripts are valid bash
        run: |
          set -euo pipefail
          awk '/^[[:space:]]*cat > \/usr\/local\/sbin\/rw-secondary-ip.sh/{f=1;next} f&&/^SCRIPT_EOF$/{exit} f' install.sh > /tmp/secondary.sh
          awk '/^[[:space:]]*cat > \/usr\/local\/sbin\/rw-node-update.sh/{f=1;next} f&&/^EOS$/{exit} f' install.sh > /tmp/update.sh
          awk '/^[[:space:]]*cat > \/usr\/local\/sbin\/rw-healthcheck.sh/{f=1;next} f&&/^HEALTH_EOF$/{exit} f' install.sh > /tmp/health.sh
          awk '/^[[:space:]]*cat > \/usr\/local\/sbin\/rw-backup.sh/{f=1;next} f&&/^BACKUP_EOF$/{exit} f' install.sh > /tmp/backup.sh
          awk '/^[[:space:]]*cat > \/usr\/local\/sbin\/rw-cert-sync.sh/{f=1;next} f&&/^CERT_SYNC_EOF$/{exit} f' install.sh > /tmp/certsync.sh
          awk '/^[[:space:]]*cat > \/usr\/local\/sbin\/rw-configs.sh/{f=1;next} f&&/^CONFIGS_EOF$/{exit} f' install.sh > /tmp/rw-configs.sh
          for pair in "/tmp/secondary.sh:secondary-ip" "/tmp/update.sh:update" "/tmp/health.sh:healthcheck" \
                      "/tmp/backup.sh:backup" "/tmp/certsync.sh:cert-sync" "/tmp/rw-configs.sh:configs"; do
            file="${pair%%:*}"
            name="${pair##*:}"
            test -s "$file" || { echo "::error::$name script not extracted"; exit 1; }
            bash -n "$file" || { echo "::error::$name script has syntax errors"; exit 1; }
            echo "$name: $(wc -l < "$file") lines, syntax ok"
          done

  generator:
    name: config generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract rw-configs.sh
        run: |
          set -euo pipefail
          awk '/^[[:space:]]*cat > \/usr\/local\/sbin\/rw-configs.sh/{f=1;next} f&&/^CONFIGS_EOF$/{exit} f' install.sh > /tmp/rw-configs.sh
          test -s /tmp/rw-configs.sh
          bash -n /tmp/rw-configs.sh

      - name: Generate with selfsteal + Hysteria2
        run: |
          set -euo pipefail
          mkdir -p /tmp/state1
          cat > /tmp/state1/answers.env <<'EOF'
          PANEL_IP='203.0.113.10'
          NODE_PORT='2222'
          CONNECT_PORT='443'
          HYSTERIA='yes'
          USE_SELFSTEAL='yes'
          DOMAIN='node.example.com'
          SELFSTEAL_PORT='9443'
          EOF
          RW_STATE_DIR=/tmp/state1 bash /tmp/rw-configs.sh generate
          # повторный запуск — обновляет параметры, не меняя ключи и shortIds
          RW_STATE_DIR=/tmp/state1 bash /tmp/rw-configs.sh generate
          RW_STATE_DIR=/tmp/state1 bash /tmp/rw-configs.sh brief
          RW_STATE_DIR=/tmp/state1 bash /tmp/rw-configs.sh keys
          RW_STATE_DIR=/tmp/state1 bash /tmp/rw-configs.sh path tcp

      - name: Validate generated JSON
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys
          d = pathlib.Path('/tmp/state1/configs')
          files = {p.stem: p for p in d.glob('*.json')}
          if set(files) != {'xhttp', 'grpc', 'tcp', 'hysteria2'}:
              sys.exit(f'unexpected configs: {sorted(files)}')
          tags = set()
          for name, path in files.items():
              cfg = json.loads(path.read_text(encoding='utf-8'))
              ib = cfg['inbounds'][0]
              tag = ib['tag']
              if not re.fullmatch(r'(NodeGo\d\d|GoNode\d\d|Node\d{4}|\d\dNode\d\d)', tag):
                  sys.exit(f'bad tag: {tag}')
              tags.add(tag)
              assert ib['port'] == 443, ib['port']
              assert ib['listen'] == '0.0.0.0'
              assert cfg['outbounds'][0]['tag'] == 'DIRECT'
              if name == 'hysteria2':
                  st = ib['streamSettings']
                  assert ib['protocol'] == 'hysteria'
                  assert st['network'] == 'hysteria' and st['security'] == 'tls'
                  assert st['tlsSettings']['serverName'] == 'node.example.com'
                  assert st['tlsSettings']['certificates'][0]['certificateFile'] == \
                      '/etc/remnanode/cert/fullchain.crt'
                  assert st['hysteriaSettings'] == {'version': 2, 'udpIdleTimeout': 60}
                  assert ib['settings']['version'] == 2
              else:
                  assert ib['protocol'] == 'vless'
                  st = ib['streamSettings']
                  assert st['security'] == 'reality'
                  rs = st['realitySettings']
                  assert rs['target'] == '127.0.0.1:9443', rs['target']
                  assert rs['serverNames'] == ['node.example.com'], rs['serverNames']
                  assert re.fullmatch(r'[A-Za-z0-9_-]{43}', rs['privateKey']), rs['privateKey']
                  assert len(rs['shortIds']) == 6, rs['shortIds']
                  assert all(re.fullmatch(r'[0-9a-f]{16}', s) for s in rs['shortIds']), rs['shortIds']
                  assert st['network'] == name, (name, st['network'])
                  if name == 'grpc':
                      assert st['grpcSettings']['serviceName']
          if len(tags) != 4:
              sys.exit(f'tags are not unique: {tags}')
          print('configs ok:', sorted(tags))
          PY

      - name: Generate without selfsteal (apple.com fallback)
        run: |
          set -euo pipefail
          mkdir -p /tmp/state2
          cat > /tmp/state2/answers.env <<'EOF'
          NODE_PORT='2222'
          CONNECT_PORT='8443'
          HYSTERIA='no'
          USE_SELFSTEAL='no'
          EOF
          RW_STATE_DIR=/tmp/state2 bash /tmp/rw-configs.sh generate
          python3 - <<'PY'
          import json, pathlib, sys
          d = pathlib.Path('/tmp/state2/configs')
          files = {p.stem: p for p in d.glob('*.json')}
          if set(files) != {'xhttp', 'grpc', 'tcp'}:
              sys.exit(f'unexpected configs without selfsteal: {sorted(files)}')
          for name, path in files.items():
              cfg = json.loads(path.read_text(encoding='utf-8'))
              ib = cfg['inbounds'][0]
              assert ib['port'] == 8443
              rs = ib['streamSettings']['realitySettings']
              assert rs['target'] == 'www.apple.com:443', rs['target']
              assert rs['serverNames'] == ['www.apple.com', 'apple.com'], rs['serverNames']
          print('fallback ok')
          PY

  config:
    name: generated configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract generated files
        run: |
          set -euo pipefail
          extract() {
            awk -v m="$1" '$0 ~ "# export:"m {f=1;next} f&&/# export:end/{exit} f' install.sh
          }
          extract node-compose      | sed '1d;$d' > /tmp/node.yml
          extract selfsteal-compose | sed '1d;$d' > /tmp/selfsteal.yml
          extract caddyfile         | sed '1d;$d' > /tmp/Caddyfile
          for f in /tmp/node.yml /tmp/selfsteal.yml /tmp/Caddyfile; do
            test -s "$f" || { echo "::error::empty $f"; exit 1; }
          done
          echo "extracted: $(wc -l < /tmp/node.yml) / $(wc -l < /tmp/selfsteal.yml) / $(wc -l < /tmp/Caddyfile) lines"

      - name: docker-compose files are valid YAML
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import yaml, sys
          for path in ("/tmp/node.yml", "/tmp/selfsteal.yml"):
              with open(path) as fh:
                  doc = yaml.safe_load(fh)
              assert isinstance(doc, dict) and "services" in doc, path
              print(path, "->", ", ".join(doc["services"]))
          PY

      - name: Caddyfile sanity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          src = open("/tmp/Caddyfile").read()
          if src.count("{") != src.count("}"):
              raise SystemExit("unbalanced braces in Caddyfile")
          for need in ("https_port", "auto_https", "file_server", "try_files", "tls"):
              if need not in src:
                  raise SystemExit(f"Caddyfile is missing {need}")
          print("Caddyfile structure ok (bind placeholder:", "__BIND_IP__" in src, ")")
          PY

