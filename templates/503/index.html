<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporarily unavailable</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f4f5f7; color:#22252b;
  }
  @media (prefers-color-scheme: dark) {
    body { background:#0f1216; color:#d3d7de; }
    .box { background:#151a20 !important; border-color:#232a33 !important; }
    .code { color:#eaeef5 !important; }
  }
  .box {
    width:min(520px,100%); background:#fff; border:1px solid #e6e8ec; border-radius:16px;
    padding:40px 36px; text-align:center;
  }
  .code { font-size:64px; font-weight:700; letter-spacing:-.03em; line-height:1; color:#16181d; }
  .label { margin-top:8px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; opacity:.5; }
  h1 { font-size:19px; margin:26px 0 10px; font-weight:600; }
  p { margin:0; opacity:.7; font-size:15px; }
  .hint { margin-top:26px; padding-top:22px; border-top:1px solid #eef0f3; font-size:13.5px; opacity:.55; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">503</div>
    <div class="label">Service Unavailable</div>
    <h1>Temporarily unavailable</h1>
    <p>The service is being updated. Please check back in a few minutes.</p>
    <div class="hint">If this persists, contact the site administrator.</div>
  </div>
</body>
</html>
