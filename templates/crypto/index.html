<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal — рынок</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f13;color:#dfe3ea;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .top{padding:12px 20px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #1b1f27}
  .logo{font-weight:700}
  .top nav a{color:#8f98a7;text-decoration:none;font-size:13.5px;margin-right:14px}
  .top .me{margin-left:auto;font-size:13px;color:#7d8695}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:#131820;border:1px solid #1e2531;border-radius:12px;padding:16px}
  .panel h2{margin:0 0 12px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:#87919f}
  .big{display:flex;align-items:baseline;gap:12px}
  .big .p{font-size:32px;font-weight:700;letter-spacing:-.02em}
  .big .d{font-size:13.5px;color:#4ade80}
  .big .d.down{color:#f87171}
  .chart{display:flex;align-items:flex-end;gap:3px;height:130px;margin:16px 0 6px}
  .chart i{flex:1;background:linear-gradient(180deg,#34d399,#0f766e);border-radius:2px;opacity:.85}
  .chart i.dn{background:linear-gradient(180deg,#f87171,#7f1d1d)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6f7887;padding:6px 8px;border-bottom:1px solid #1e2531}
  td{padding:9px 8px;border-bottom:1px solid #171d26}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .up{color:#4ade80}.dn{color:#f87171}
  .buy{margin-top:12px;display:flex;gap:8px}
  .buy button{flex:1;padding:11px;border:0;border-radius:9px;font:600 13.5px/1 inherit;cursor:pointer;background:#22c55e;color:#05230f}
  .buy button.sell{background:#ef4444;color:#2b0707}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Terminal</div>
  <nav><a href="#">Рынок</a><a href="#">Портфель</a><a href="#">История</a></nav>
  <div class="me">демо-аккаунт</div>
</div>
<div class="wrap">
  <div class="grid">
    <div class="panel">
      <h2>BTC / USDT</h2>
      <div class="big"><span class="p">64 182.40</span><span class="d">+2.41%</span><span style="margin-left:auto;font-size:12.5px;color:#7d8695">24h объём 1.2B</span></div>
      <div class="chart">
        <i style="height:38%"></i><i style="height:45%"></i><i style="height:41%"></i><i class="dn" style="height:33%"></i>
        <i style="height:48%"></i><i style="height:56%"></i><i style="height:52%"></i><i style="height:64%"></i>
        <i class="dn" style="height:58%"></i><i style="height:71%"></i><i style="height:78%"></i><i style="height:86%"></i>
      </div>
      <div class="buy"><button type="button">Купить</button><button class="sell" type="button">Продать</button></div>
    </div>
    <div class="panel">
      <h2>Портфель</h2>
      <table>
        <tr><th>Актив</th><th class="num">Кол-во</th><th class="num">Δ 24h</th></tr>
        <tr><td>BTC</td><td class="num">0.184</td><td class="num up">+2.4%</td></tr>
        <tr><td>ETH</td><td class="num">2.40</td><td class="num up">+1.1%</td></tr>
        <tr><td>SOL</td><td class="num">18.0</td><td class="num dn">−0.8%</td></tr>
        <tr><td>USDT</td><td class="num">1 240</td><td class="num">0.0%</td></tr>
      </table>
      <div style="margin-top:14px;font-size:13px;color:#87919f">Итого ≈ $14 820</div>
    </div>
  </div>
</div>
</body>
</html>
