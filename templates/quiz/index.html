<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квиз — проверь знание сетей</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:radial-gradient(900px 500px at 15% -10%,#e9efff,#f8f8fb 60%);
       color:#16191f;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){body{background:radial-gradient(900px 500px at 15% -10%,#16233c,#0c0f14 60%);color:#d6dae1}
    .card{background:#121821!important;border-color:#202834!important}.opt{background:#0f1520!important;border-color:#222b38!important}}
  .card{width:min(620px,100%);background:#fff;border:1px solid #e6e9ee;border-radius:16px;padding:28px 30px;box-shadow:0 18px 50px rgba(16,24,40,.08)}
  .top{display:flex;align-items:center;gap:12px;font-size:12.5px;opacity:.55;margin-bottom:14px}
  .prog{flex:1;height:6px;border-radius:4px;background:#eceef4;overflow:hidden}
  .prog i{display:block;height:100%;width:40%;background:#2563eb}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
  .q{opacity:.7;margin-bottom:18px}
  .opt{display:block;padding:12px 14px;border:1px solid #e3e7ee;border-radius:10px;margin-bottom:9px;cursor:pointer;font-size:14.5px}
  .opt:hover{border-color:#c7d3ea}
  .opt b{display:inline-block;width:22px;height:22px;border-radius:6px;background:#f1f4f9;text-align:center;line-height:22px;font-size:12.5px;margin-right:9px}
  .foot{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px;opacity:.55}
  button{padding:10px 18px;border:0;border-radius:9px;background:#2563eb;color:#fff;font:600 14px/1 inherit;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span>Вопрос 4 из 10</span><div class="prog"><i></i></div><span>Сети</span></div>
  <h1>Что произойдёт, если увеличить nf_conntrack_max?</h1>
  <div class="q">Выберите один вариант. Осталось 0:38.</div>
  <div class="opt"><b>A</b>Разрешит больше одновременных соединений</div>
  <div class="opt"><b>B</b>Ускорит TCP-соединения в 2 раза</div>
  <div class="opt"><b>C</b>Отключит NAT</div>
  <div class="opt"><b>D</b>Ничего не изменится</div>
  <div class="foot"><span>+10 баллов за верный ответ</span><button type="button" style="margin-left:auto">Ответить</button></div>
</div>
</body>
</html>
