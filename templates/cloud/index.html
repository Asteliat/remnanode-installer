<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftbox — Files</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         background:#f6f7f9; color:#16181d; }
  @media (prefers-color-scheme: dark) {
    body { background:#0d1015; color:#d5d9e0; }
    .panel, .row { background:#141922 !important; border-color:#222936 !important; }
    .side { background:#11161d !important; }
  }
  .app { display:flex; min-height:100vh; }
  .side { width:240px; background:#fff; border-right:1px solid #e6e8ec; padding:22px 16px; flex-shrink:0; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:650; margin-bottom:26px; }
  .dot { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#22c55e,#0ea5e9); }
  .side a { display:block; padding:9px 12px; border-radius:9px; color:inherit; text-decoration:none; opacity:.75; margin-bottom:2px; font-size:14.5px; }
  .side a.active { background:#eef2ff; color:#2743c7; opacity:1; font-weight:600; }
  .main { flex:1; padding:34px 40px 60px; max-width:1100px; }
  h1 { font-size:22px; margin:0 0 6px; letter-spacing:-.01em; }
  .sub { opacity:.6; font-size:14px; margin-bottom:28px; }
  .panel { background:#fff; border:1px solid #e6e8ec; border-radius:14px; padding:22px; margin-bottom:22px; }
  .drop { border:1.5px dashed #c9ced8; border-radius:12px; padding:34px; text-align:center; opacity:.8; }
  .row { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #e6e8ec;
         border-radius:11px; padding:13px 16px; margin-bottom:9px; }
  .ico { width:34px; height:34px; border-radius:9px; background:#eef2ff; display:grid; place-items:center;
         font-size:15px; color:#2743c7; flex-shrink:0; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { font-size:13px; opacity:.55; }
  .bar { height:6px; border-radius:4px; background:#e9ecf1; overflow:hidden; margin-top:14px; }
  .bar i { display:block; height:100%; width:62%; background:linear-gradient(90deg,#22c55e,#0ea5e9); }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="dot"></span> Driftbox</div>
    <a class="active" href="#">All files</a>
    <a href="#">Recent</a>
    <a href="#">Shared</a>
    <a href="#">Archive</a>
    <a href="#">Trash</a>
  </aside>
  <main class="main">
    <h1>All files</h1>
    <div class="sub">412 items · 63.8 GB of 100 GB used</div>

    <div class="panel">
      <div class="drop">Drop files here to upload<br><span class="meta">or click to browse</span></div>
      <div class="bar"><i></i></div>
    </div>

    <div class="row"><span class="ico">PDF</span><span class="name">quarterly-report-2025.pdf</span><span class="meta">4.2 MB</span></div>
    <div class="row"><span class="ico">ZIP</span><span class="name">logs-archive-11.zip</span><span class="meta">812 MB</span></div>
    <div class="row"><span class="ico">IMG</span><span class="name">hero-shot-final.png</span><span class="meta">9.7 MB</span></div>
    <div class="row"><span class="ico">DOC</span><span class="name">onboarding-notes.docx</span><span class="meta">126 KB</span></div>
    <div class="row"><span class="ico">CSV</span><span class="name">metrics-export.csv</span><span class="meta">31 MB</span></div>
  </main>
</div>
</body>
</html>
