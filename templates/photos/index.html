<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame — фотографии</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;background:#fbfbfb;color:#191a1d;font:14.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#0c0d0f;color:#d6d7db}.top,.card{background:#131417!important;border-color:#202126!important}}
  .top{background:#fff;border-bottom:1px solid #e9e9ec;padding:13px 22px;display:flex;align-items:center;gap:18px}
  .logo{font-weight:700;letter-spacing:-.01em}
  .top nav a{color:inherit;text-decoration:none;font-size:13.5px;opacity:.65;margin-right:14px}
  .top .me{margin-left:auto;font-size:13px;opacity:.55}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 70px}
  h1{font-size:21px;margin:0 0 3px}
  .sub{font-size:13px;opacity:.55;margin-bottom:18px}
  .masonry{columns:3;column-gap:12px}
  @media (max-width:860px){.masonry{columns:2}}
  @media (max-width:560px){.masonry{columns:1}}
  .ph{break-inside:avoid;margin-bottom:12px;border-radius:11px;overflow:hidden;background:#dfe3ea;position:relative}
  .ph::after{content:"";display:block;padding-top:62%}
  .ph.a{background:linear-gradient(135deg,#c7d2fe,#93a5fd)}
  .ph.b{background:linear-gradient(135deg,#fbcfe8,#f9a8d4)}
  .ph.c{background:linear-gradient(135deg,#bbf7d0,#86efac)}
  .ph.d{background:linear-gradient(135deg,#fde68a,#fbbf24)}
  .ph.e{background:linear-gradient(135deg,#bae6fd,#7dd3fc)}
  .ph.f{background:linear-gradient(135deg,#e5e7eb,#9ca3af)}
  .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;font-size:12.5px;
           color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Frame</div>
  <nav><a href="#">Лента</a><a href="#">Альбомы</a><a href="#">Избранное</a></nav>
  <div class="me">128 фотографий · 4 альбома</div>
</div>
<div class="wrap">
  <h1>Зимний север</h1>
  <div class="sub">Октябрь · 24 кадра · снято на 35 мм</div>
  <div class="masonry">
    <div class="ph a"><div class="cap">Утро на станции</div></div>
    <div class="ph c"><div class="cap">Сосны и туман</div></div>
    <div class="ph d"><div class="cap">Окно депо</div></div>
    <div class="ph b"><div class="cap">Закат над путями</div></div>
    <div class="ph e"><div class="cap">Дым над посёлком</div></div>
    <div class="ph f"><div class="cap">Провода</div></div>
    <div class="ph c"><div class="cap">Снег на крыше</div></div>
    <div class="ph a"><div class="cap">Тропа</div></div>
    <div class="ph e"><div class="cap">Река во льду</div></div>
  </div>
</div>
</body>
</html>
