<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Meridian Cloud</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(900px 500px at 20% -10%, #e9efff, #f7f8fa 55%);
    color:#16191f;
  }
  @media (prefers-color-scheme: dark) {
    body { background:radial-gradient(900px 500px at 20% -10%, #16233c, #0c0f14 55%); color:#d6dae1; }
    .card { background:#121821 !important; border-color:#202834 !important; }
    .field input { background:#0e141c !important; border-color:#232b37 !important; color:#e6eaf0 !important; }
    .sep::before, .sep::after { background:#232b37 !important; }
  }
  .card {
    width:min(400px,100%); background:#fff; border:1px solid #e6e9ee; border-radius:16px;
    padding:30px 28px; box-shadow:0 18px 50px rgba(16,24,40,.08);
  }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .mark { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#2563eb,#7c3aed); }
  .logo b { font-size:15.5px; letter-spacing:-.01em; }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:-.015em; }
  .sub { font-size:14px; opacity:.6; margin-bottom:22px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; opacity:.7; margin-bottom:6px; }
  .field input {
    width:100%; padding:11px 13px; border:1px solid #dfe3ea; border-radius:10px;
    font:inherit; background:#fff; color:inherit;
  }
  .field input:focus { outline:2px solid #c7d6ff; outline-offset:1px; }
  .row { display:flex; align-items:center; justify-content:space-between; margin:14px 0 18px; font-size:13.5px; }
  .row label { display:flex; align-items:center; gap:7px; opacity:.75; }
  .row a { color:#2563eb; text-decoration:none; }
  button { width:100%; padding:12px; border:0; border-radius:10px; cursor:pointer;
           font:600 15px/1 inherit; color:#fff; background:linear-gradient(135deg,#2563eb,#6d28d9); }
  button:active { transform:translateY(1px); }
  .sep { display:flex; align-items:center; gap:12px; margin:20px 0; font-size:12.5px; opacity:.5; }
  .sep::before, .sep::after { content:""; height:1px; background:#e7eaef; flex:1; }
  .alt { display:flex; gap:10px; }
  .alt button { background:transparent; color:inherit; border:1px solid #dfe3ea; font-weight:600; font-size:14px; }
  @media (prefers-color-scheme: dark) { .alt button { border-color:#232b37; } }
  .foot { text-align:center; font-size:13px; opacity:.6; margin-top:20px; }
  .foot a { color:inherit; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="mark"></span><b>Meridian Cloud</b></div>
  <h1>Sign in to your workspace</h1>
  <div class="sub">Use your work email to continue.</div>

  <form onsubmit="return false">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" placeholder="••••••••••" autocomplete="current-password">
    </div>
    <div class="row">
      <label><input type="checkbox" style="width:auto;padding:0"> Keep me signed in</label>
      <a href="#">Forgot password?</a>
    </div>
    <button type="submit">Sign in</button>
  </form>

  <div class="sep">or continue with</div>
  <div class="alt">
    <button type="button">SSO</button>
    <button type="button">Passkey</button>
  </div>

  <div class="foot">No account? <a href="#">Request access</a></div>
</div>
</body>
</html>
